<style>
    @keyframes breathePulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.85;
      }
      50% {
        transform: scale(1.045);
        opacity: 1;
      }
    }

    @keyframes auraFloat {
      0%, 100% {
        transform: translate(-50%, -50%) scale(0.95);
        opacity: 0.28;
      }
      50% {
        transform: translate(-50%, -50%) scale(1.1);
        opacity: 0.42;
      }
    }

    .pulse-breath {
      animation: breathePulse 5.5s ease-in-out infinite;
    }

    .aura-glow {
      animation: auraFloat 7s ease-in-out infinite;
    }

    .eucalyptus-shadow {
      filter: drop-shadow(0 0 24px rgba(45, 212, 191, 0.35)) drop-shadow(0 0 60px rgba(16, 185, 129, 0.15));
    }
  </style>

<body class="bg-surface-container-lowest text-on-surface min-h-screen flex items-center justify-center p-0 m-0 overflow-hidden font-body-md select-none">
