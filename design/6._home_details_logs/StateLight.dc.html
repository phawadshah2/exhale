<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Light mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#00796B}a:hover{color:#005B50}
</style>
</helmet>
<div style="width: 390px; height: 760px; box-sizing: border-box; background: #F4F7FA; color: #161C25; font-family: 'Plus Jakarta Sans', sans-serif; padding: 62px 20px 0; display: flex; flex-direction: column; gap: 16px; overflow: hidden">

<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 52px; height: 52px; border-radius: 50%; border: 2px solid #2DD4BF; background: #FFFFFF; display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0">
<svg width="24" height="24" viewBox="0 0 24 24" fill="#161C25" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 20a8 8 0 0 1 16 0z"></path></svg>
<span style="position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); background: #00796B; color: #FFFFFF; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 99px">D12</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; color: #5B6573">Wednesday, Oct 21</span>
<span style="font-family: Manrope, sans-serif; font-size: 23px; font-weight: 700">Good afternoon</span>
</div>
</div>

<div style="height: 48px; box-sizing: border-box; border-radius: 99px; background: #ECF0F4; padding: 0 8px 0 12px; display: flex; align-items: center; gap: 10px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00796B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.1 9.6 4.2 4.2 0 0 0 7 18z"></path></svg>
<span style="flex-grow: 1; font-size: 14px; font-weight: 600">Vaping · Drops to 10 in 4d</span>
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #00796B; background: rgba(45,212,191,0.16); border: 1px solid rgba(0,121,107,0.35); border-radius: 99px; padding: 3px 10px">STAGE 2 / 9</span>
</div>

<div style="background: #FFFFFF; border-radius: 28px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#00796B" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 8h10a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7"></path></svg>
<span style="flex-grow: 1; font-family: Manrope, sans-serif; font-size: 20px; font-weight: 700">Today's Consumption</span>
<span style="font-size: 12px; font-weight: 600; color: #00704A; background: rgba(0,135,90,0.1); border: 1px solid rgba(0,135,90,0.35); border-radius: 99px; padding: 4px 10px; display: flex; align-items: center; gap: 6px"><span style="width: 6px; height: 6px; border-radius: 50%; background: #00875A"></span>On track</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between">
<button type="button" aria-label="Previous day" style="border: 0; background: transparent; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B6573" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<div style="position: relative; width: 220px; height: 220px">
<svg width="220" height="220" viewBox="0 0 220 220" role="img" aria-label="4 of 11 sessions today">
<defs><linearGradient id="ringL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00A572"></stop><stop offset="1" stop-color="#2DD4BF"></stop></linearGradient></defs>
<circle cx="110" cy="110" r="96" fill="none" stroke="#ECF0F4" stroke-width="14"></circle>
<circle cx="110" cy="110" r="96" fill="none" stroke="url(#ringL)" stroke-width="14" stroke-linecap="round" stroke-dasharray="219 603" transform="rotate(-90 110 110)"></circle>
</svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<div style="display: flex; align-items: baseline; gap: 4px"><span style="font-family: Manrope, sans-serif; font-size: 56px; font-weight: 700">4</span><span style="font-family: Manrope, sans-serif; font-size: 24px; font-weight: 600; color: #5B6573">/ 11</span></div>
<span style="font-family: Manrope, sans-serif; font-size: 18px; font-weight: 600; color: #00796B">7 left today</span>
<span style="font-size: 12px; color: #5B6573">36% of daily limit</span>
</div>
</div>
<button type="button" aria-label="Next day" disabled style="border: 0; background: transparent; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C3CBD5" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>
<div style="height: 1px; background: #E4E9EF"></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #5B6573">Last entry</span><span style="font-size: 16px; font-weight: 600">24m ago</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #5B6573">Last trigger</span><span style="font-size: 16px; font-weight: 600">Stress</span></div>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":760}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
