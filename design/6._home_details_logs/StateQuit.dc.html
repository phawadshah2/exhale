<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>After the quit date</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#57F1DB}a:hover{color:#2DD4BF}
</style>
</helmet>
<div style="width: 390px; height: 760px; box-sizing: border-box; background: #0E141D; color: #DDE2F0; font-family: 'Plus Jakarta Sans', sans-serif; padding: 62px 20px 0; display: flex; flex-direction: column; gap: 16px; overflow: hidden">

<div style="height: 48px; box-sizing: border-box; border-radius: 99px; background: #242A34; border: 1px solid rgba(60,74,70,0.6); padding: 0 8px 0 12px; display: flex; align-items: center; gap: 10px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4EDEA3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.1 9.6 4.2 4.2 0 0 0 7 18z"></path></svg>
<span style="flex-grow: 1; font-size: 14px; font-weight: 600">Vape-free since Jan 12</span>
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #4EDEA3; background: rgba(78,222,163,0.12); border: 1px solid rgba(78,222,163,0.45); border-radius: 99px; padding: 3px 10px">QUIT</span>
</div>

<div style="background: #161C25; border: 1px solid #2C333D; border-radius: 28px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4EDEA3" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 8h10a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7"></path></svg>
<span style="flex-grow: 1; font-family: Manrope, sans-serif; font-size: 20px; font-weight: 700">Today's Consumption</span>
<span style="font-size: 12px; font-weight: 600; color: #4EDEA3; background: rgba(78,222,163,0.12); border: 1px solid rgba(78,222,163,0.45); border-radius: 99px; padding: 4px 10px; display: flex; align-items: center; gap: 6px"><span style="width: 6px; height: 6px; border-radius: 50%; background: #4EDEA3"></span>Vape-free</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between">
<button type="button" aria-label="Previous day" style="border: 0; background: transparent; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#93A0AE" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<div style="position: relative; width: 220px; height: 220px">
<svg width="220" height="220" viewBox="0 0 220 220" role="img" aria-label="Vape-free today">
<circle cx="110" cy="110" r="96" fill="none" stroke="#4EDEA3" stroke-width="14" opacity="0.9"></circle>
</svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<span style="font-family: Manrope, sans-serif; font-size: 56px; font-weight: 700; letter-spacing: -0.03em">9</span>
<span style="font-family: Manrope, sans-serif; font-size: 18px; font-weight: 600; color: #4EDEA3">days vape-free</span>
<span style="font-size: 12px; color: #93A0AE">Nothing logged today</span>
</div>
</div>
<button type="button" aria-label="Next day" disabled style="border: 0; background: transparent; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3C4A46" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>
<div style="background: rgba(78,222,163,0.08); border: 1px solid rgba(78,222,163,0.3); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<span style="font-family: Manrope, sans-serif; font-size: 16px; font-weight: 700">You reached your quit date</span>
<span style="font-size: 13px; color: #93A0AE; line-height: 1.45">Your limit stays at zero. A slip still gets logged and doesn't reset your plan.</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" style="height: 44px; border-radius: 99px; border: 0; background: #4EDEA3; color: #002113; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 700">Keep at zero</button>
<button type="button" style="height: 44px; border-radius: 99px; border: 1px solid #2C333D; background: #1A2029; color: #DDE2F0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600">New goal</button>
</div>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":760}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
