<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Highlighted stage, 90 days</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.t-light{--bg:#F4F7FA;--card:#FFFFFF;--ink:#161C25;--muted:#5B6573;--line:#E4E9EF;--high:#E6EBF0;--pill:#ECF0F4;--inner:#F1F4F7;--good:#00704A;--warn:#B26B00;--danger:#BA1A1A;--dash:#AEB6C1;}
.t-dark{--bg:#0E141D;--card:#161C25;--ink:#DDE2F0;--muted:#93A0AE;--line:#2C333D;--high:#2F353F;--pill:#242A34;--inner:#1E252F;--good:#4EDEA3;--warn:#FFB95F;--danger:#FFB4AB;--dash:#5A6370;}
.t-light.a-ink{--accent:#111418;--on-accent:#FFFFFF;--accent-text:#111418}
.t-dark.a-ink{--accent:#F4F7FA;--on-accent:#111418;--accent-text:#F4F7FA}
.t-light.a-eucalyptus{--accent:#2DD4BF;--on-accent:#003731;--accent-text:#00796B}
.t-dark.a-eucalyptus{--accent:#2DD4BF;--on-accent:#003731;--accent-text:#57F1DB}
.t-light.a-ocean{--accent:#3B82F6;--on-accent:#FFFFFF;--accent-text:#1D5FD1}
.t-dark.a-ocean{--accent:#3B82F6;--on-accent:#FFFFFF;--accent-text:#A9C7FF}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 600px; box-sizing: border-box; background: var(--bg); color: var(--ink); font-family: 'Plus Jakarta Sans', sans-serif; padding: 20px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
  <div style="display: flex; justify-content: space-between; padding: 0 4px">
    <span style="font-size: 11px; line-height: 16px; font-weight: 700; letter-spacing: 0.08em; color: var(--muted)">YOU, REGRETTABLY</span>
    <span style="font-size: 12px; line-height: 16px; color: var(--muted)">Stage 2 of 3</span>
  </div>
  <div style="background: var(--card); border: 2px solid var(--accent); border-radius: 24px; padding: 12px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="position: relative; width: 56px; height: 56px; flex-shrink: 0">
        <svg width="56" height="56" viewBox="0 0 44 44" aria-hidden="true">
          <circle cx="22" cy="22" r="18" fill="none" stroke="var(--high)" stroke-width="4"></circle>
          <circle cx="22" cy="22" r="18" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" pathLength="100" stroke-dasharray="{{ringDash}}" transform="rotate(-90 22 22)"></circle>
        </svg>
        <span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: Manrope, sans-serif; font-size: 18px; font-weight: 700">2</span>
      </span>
      <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column">
        <span style="display: flex; align-items: center; gap: 6px"><span style="font-size: 14px; line-height: 20px; font-weight: 600">Stage 2</span><span style="font-size: 10px; line-height: 14px; font-weight: 700; letter-spacing: 0.08em; background: var(--accent); color: var(--on-accent); border-radius: 99px; padding: 2px 7px">NOW</span></span>
        <span style="font-size: 12px; line-height: 16px; color: var(--muted)">{{range}} · day {{dayIndex}} of {{days}}</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end">
        <span style="font-size: 14px; line-height: 20px; font-weight: 700; color: var(--good)">{{saved}}</span>
        <span style="font-size: 11px; line-height: 16px; color: var(--muted)">of {{canSave}}</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 11px; line-height: 14px; color: var(--muted)">{{startLabel}}</span>
      <div style="display: grid; grid-template-columns: repeat({{cols}}, {{size}}px); justify-content: space-between; row-gap: {{rowGap}}px" role="img" aria-label="{{dotsLabel}}">
        <sc-for list="{{dots}}" as="o" hint-placeholder-count="90">
          <span style="width: {{size}}px; height: {{size}}px; box-sizing: border-box; border-radius: 50%; background: {{o.fill}}; border: {{o.border}}"></span>
        </sc-for>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 11px; line-height: 14px; color: var(--muted)">
        <span style="font-weight: 600">Each dot is a day</span>
        <span>{{endLabel}}</span>
      </div>
    </div>

    <div style="display: flex; justify-content: center; gap: 14px; font-size: 12px; line-height: 16px; color: var(--muted)">
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--accent)"></span>Under</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--warn)"></span>At limit</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--danger)"></span>Over</span>
    </div>

    <div style="border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; line-height: 18px; font-weight: 600">{{used}} of {{allowed}} used · {{overText}}</span>
      <span style="font-size: 12px; line-height: 18px; color: var(--muted)">Drops to 1 in {{dropIn}} days. Try to look surprised.</span>
    </div>
  </div>

  <label style="display: flex; flex-direction: column; gap: 2px; padding: 4px 4px 0; font-size: 12px; line-height: 16px; color: var(--muted)">
    <span>Preview only: a {{days}}-day stage, {{cols}} dots across, {{rows}} rows, {{size}} px</span>
    <input type="range" min="15" max="365" step="1" value="{{days}}" onChange="{{onDays}}" style="width: 100%; height: 32px; margin: 0; accent-color: var(--accent)">
  </label>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"enum","options":["ink","eucalyptus","ocean"],"default":"ink"},"$preview":{"width":390,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const days = (this.state && this.state.days) ?? 90;
    const limit = 2;
    const baseline = 3;
    const pattern = [2, 1, 2, 3, 1, 2, 1, 2, 3, 1, 2, 1, 1];
    const dayIndex = Math.floor(days / 2) + 1;
    const DAY = 86400000;
    const today = Date.UTC(2026, 10, 1);
    const start = today - (dayIndex - 1) * DAY;
    const end = start + (days - 1) * DAY;
    const short = (t) => new Date(t).toLocaleDateString('en-US', { timeZone: 'UTC', month: 'short', day: 'numeric' });

    // 13 across up to 4 rows, then smaller to keep 4 rows, down to 7 px at 33
    // across. Past 132 days the dots stay at 7 px and the rows grow.
    const width = 322;
    const cols = days <= 52 ? 13 : Math.min(33, Math.ceil(days / 4));
    const rows = Math.ceil(days / cols);
    const size = Math.max(7, Math.min(16, Math.floor((width / cols) * 0.72)));
    const rowGap = Math.max(3, Math.min(8, Math.round(size * 0.5)));

    const dots = [];
    let used = 1;
    let over = 0;
    for (let i = 0; i < dayIndex - 1; i++) {
      const u = pattern[i % pattern.length];
      used += u;
      if (u > limit) over += 1;
      dots.push({ fill: u > limit ? 'var(--danger)' : u === limit ? 'var(--warn)' : 'var(--accent)', border: '0' });
    }
    // Today: the day is not over, so it has no result yet.
    dots.push({ fill: 'transparent', border: Math.max(2, Math.round(size * 0.3)) + 'px solid var(--accent)' });
    for (let i = dayIndex; i < days; i++) dots.push({ fill: 'transparent', border: (size < 8 ? 1 : 1.5) + 'px solid var(--dash)' });

    const allowed = limit * days;
    return {
      themeClass: (this.props.dark ? 't-dark' : 't-light') + ' a-' + (this.props.accent ?? 'ink'),
      days,
      dayIndex,
      cols,
      rows,
      size,
      rowGap,
      dots,
      used,
      allowed,
      range: short(start) + ' – ' + short(end),
      startLabel: short(start),
      endLabel: short(end),
      overText: over + (over === 1 ? ' day over' : ' days over'),
      saved: '$' + ((baseline * dayIndex - used) * 0.4).toFixed(2),
      canSave: '$' + (days * (baseline - limit) * 0.4).toFixed(2),
      ringDash: Math.round((used / allowed) * 100) + ' 100',
      dropIn: days - dayIndex + 1,
      dotsLabel: days + ' days, one dot each. Today is day ' + dayIndex + '. ' + over + ' days over.',
      onDays: (e) => this.setState({ days: Number(e.target.value) }),
    };
  }
}
</script>
</body>
</html>
